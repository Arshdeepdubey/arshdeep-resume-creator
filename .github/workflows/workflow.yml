name: Tailor resume

on:
  workflow_dispatch:
    inputs:
      job_description:
        description: "Paste the job description. It is saved to jobs/sample_jd.txt and used for this run. Leave empty to use the committed file."
        required: false
        type: string
      job_slug:
        description: "Short name for the output file, e.g. bloomreach-software-engineer"
        required: true
        default: "tailored"
        type: string
      instructions:
        description: "Extra instructions for this run (optional)"
        required: false
        type: string
      ollama_model:
        description: "Ollama base model (same as the local setup)"
        required: false
        default: "llama3.1:8b"
        type: string
      output_repo:
        description: "Optional owner/repo to save the .tex into. Leave empty to only download the artifact."
        required: false
        type: string
      output_branch:
        description: "Branch in output_repo"
        required: false
        default: "main"
        type: string

permissions:
  contents: write   # lets the run commit the updated jobs/sample_jd.txt back to this branch

jobs:
  tailor:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install LaTeX (cached after the first run)
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended lmodern
          version: v1

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Cache Ollama models
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ollama-${{ inputs.ollama_model }}

      - name: Start Ollama and load the model
        env:
          OLLAMA_MODEL: ${{ inputs.ollama_model }}
        run: |
          set -euo pipefail
          nohup ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:11434/api/tags >/dev/null && break
            sleep 2
          done
          ollama pull "$OLLAMA_MODEL"
          # Same settings as the local Modelfile (8192-token context)
          ollama create resume-llm -f Modelfile

      - name: Save pasted JD to jobs/sample_jd.txt
        if: inputs.job_description != ''
        env:
          JD_TEXT: ${{ inputs.job_description }}
          JOB_SLUG: ${{ inputs.job_slug }}
        run: |
          set -euo pipefail
          cp jobs/sample_jd.txt "$RUNNER_TEMP/previous_jd.txt" 2>/dev/null || : > "$RUNNER_TEMP/previous_jd.txt"
          printf '%s\n' "$JD_TEXT" > jobs/sample_jd.txt
          if cmp -s "$RUNNER_TEMP/previous_jd.txt" jobs/sample_jd.txt; then
            echo "Job description unchanged"
            exit 0
          fi
          git config user.name "resume-bot"
          git config user.email "actions@users.noreply.github.com"
          git add jobs/sample_jd.txt
          git commit -m "Update job description: ${JOB_SLUG}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Tailor resume
        env:
          # Inputs go through env vars (never interpolated into the shell) to avoid injection.
          JD_FILE: jobs/sample_jd.txt
          EXTRA_INSTRUCTIONS: ${{ inputs.instructions }}
          JOB_SLUG: ${{ inputs.job_slug }}
          LLM_MODEL: resume-llm
          LLM_BASE_URL: http://localhost:11434/v1
          LLM_API_KEY: ollama
        run: python scripts/tailor.py

      - name: Upload resume (.tex) for download
        uses: actions/upload-artifact@v4
        with:
          name: resume-${{ inputs.job_slug }}
          path: output/*.tex
          if-no-files-found: error

      - name: Save resume to output repo
        if: inputs.output_repo != ''
        env:
          OUTPUT_REPO: ${{ inputs.output_repo }}
          OUTPUT_BRANCH: ${{ inputs.output_branch }}
          OUTPUT_TOKEN: ${{ secrets.OUTPUT_REPO_TOKEN }}
          JOB_SLUG: ${{ inputs.job_slug }}
        run: |
          set -euo pipefail
          test -n "$OUTPUT_TOKEN" || { echo "Add the OUTPUT_REPO_TOKEN secret (a token with write access to output_repo)"; exit 1; }
          git clone --depth 1 --branch "$OUTPUT_BRANCH" "https://x-access-token:${OUTPUT_TOKEN}@github.com/${OUTPUT_REPO}.git" target
          mkdir -p target/resumes
          cp output/*.tex target/resumes/
          cd target
          git config user.name "resume-bot"
          git config user.email "actions@users.noreply.github.com"
          git add resumes
          git commit -m "Add tailored resume: ${JOB_SLUG}" || echo "No changes to commit"
          git push origin "HEAD:${OUTPUT_BRANCH}"
